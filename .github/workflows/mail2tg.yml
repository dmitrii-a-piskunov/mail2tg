name: Почта → Telegram

on:
  schedule:
    # каждые 5 минут со смещением от начала часа; GitHub может задерживать запуск
    - cron: "2-59/5 * * * *"
    # раз в месяц — служебный коммит, чтобы GitHub не отключил расписание
    # (оно выключается после 60 дней без активности в репозитории)
    - cron: "17 3 1 * *"
  workflow_dispatch:      # кнопка ручного запуска во вкладке Actions
    inputs:
      test_notification:
        description: "Только тест уведомления владельцу (без обработки почты)"
        type: boolean
        required: false
        default: false
      since:
        description: "Повторить обработанную историю с даты (2026-09-01 или 01.09.2026). Та же дата — продолжить. Пусто — новые"
        required: false
        default: ""
      max_per_run:
        description: "Сколько писем отправить за этот запуск"
        required: false
        default: "20"
      retry_uids:
        description: "Сбросить лимит попыток для неудачных UID через запятую. Для истории также укажите since"
        required: false
        default: ""

permissions:
  contents: write         # нужно, чтобы сохранять state.json

concurrency:
  group: mail2tg
  cancel-in-progress: false

jobs:
  test_notification:
    if: ${{ inputs.test_notification == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Отправить тестовое уведомление владельцу
        run: python3 monitoring.py --test
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

  forward:
    if: ${{ inputs.test_notification != true }}
    runs-on: ubuntu-24.04     # фиксируем версию, чтобы обновления GitHub ничего не сломали
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Сохранить состояние до запуска для сравнения ошибок
        run: cp state.json "$RUNNER_TEMP/mail2tg-state-before.json"

      - name: Установить зависимости
        # playwright нужен для скриншотов писем; сам браузер (Chrome) в GitHub уже установлен
        run: python -m pip install --quiet -r requirements.txt

      - name: Проверить зависимости
        run: python -m pip check

      - name: Проверить код перед пересылкой
        run: |
          python -m py_compile mail2tg.py monitoring.py
          python -c "import requests; from playwright.sync_api import sync_playwright"
          python -B -m unittest discover -s tests -v

      - name: Переслать новые письма
        run: python3 mail2tg.py
        env:
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BACKFILL_SINCE: ${{ inputs.since }}
          MAX_PER_RUN: ${{ inputs.max_per_run }}
          RETRY_FAILED_UIDS: ${{ inputs.retry_uids }}
          # картинка письма: always — для всех писем, auto — только с таблицами, off — выключить
          SCREENSHOTS: always

      - name: Сохранить состояние
        id: save_state
        if: always()
        run: |
          git config user.name "mail2tg-bot"
          git config user.email "mail2tg-bot@users.noreply.github.com"
          if [ "${{ github.event.schedule }}" = "17 3 1 * *" ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > keepalive.txt
            git add keepalive.txt
          fi
          [ -f state.json ] && git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Обновление состояния" --quiet
            # если за время запуска в репозиторий что-то отправили (например, новую
            # версию кода), сначала подтягиваем изменения, потом сохраняем; при
            # конфликте в state.json побеждает версия бота
            for attempt in 1 2 3 4 5; do
              if git pull --rebase -X theirs --quiet && git push --quiet; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 5))
            done
            echo "Не удалось сохранить состояние"
            exit 1
          fi

      - name: Сохранить резервную копию состояния при ошибке push
        if: ${{ failure() && steps.save_state.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: mail2tg-state-${{ github.run_id }}
          path: state.json
          retention-days: 7
          if-no-files-found: error

      - name: Уведомить владельца и подтвердить успешную проверку почты
        if: always()
        run: python3 monitoring.py
        env:
          WORKFLOW_STATUS: ${{ job.status }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          BACKFILL_SINCE: ${{ inputs.since }}
          RETRY_FAILED_UIDS: ${{ inputs.retry_uids }}
          STATE_BEFORE_PATH: ${{ runner.temp }}/mail2tg-state-before.json
